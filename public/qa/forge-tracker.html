 el('ff-editor-mount').innerHTML='<form id="ff-editor" class="ff-editor"><h3 class="ff-wide">'+(row?'Edit opportunity':'Add opportunity')+'</h3>'+fields.map(k=>{if(k==='same_company_review')return '<label class="ff-check ff-wide"><input name="'+k+'" type="checkbox">'+labels[k]+'</label>';let widget;if(states[k])widget='<select name="'+k+'">'+opts(states[k])+'</select>';else if(['fit_notes','eligibility_notes','deadline_note','terms','next_action','notes'].includes(k))widget='<textarea name="'+k+'" rows="3" maxlength="'+max[k]+'"></textarea>';else widget='<input name="'+k+'" '+(['title','provider','source_url'].includes(k)?'required ':'')+'type="'+(['deadline','last_checked'].includes(k)?'date':k==='amount'?'number':k==='source_url'?'url':'text')+'" '+(max[k]?'maxlength="'+max[k]+'" ':'')+(k==='amount'?'min="0" step="any" ':k==='currency'?'maxlength="3" pattern="[A-Za-z]{3}" ':'')+'>';return '<label '+(['fit_notes','eligibility_notes','terms','next_action','notes'].includes(k)?'class="ff-wide"':'')+'>'+labels[k]+widget+'</label>'}).join('')+'<div class="ff-editor-actions ff-wide"><button class="fw-button primary" type="submit">Save opportunity</button><button class="fw-button" type="button" id="ff-cancel">Cancel</button></div><p class="ff-wide" id="ff-save-status" role="status" aria-live="polite"></p></form>';
 form=el('ff-editor');fields.forEach(k=>{const e=form.elements.namedItem(k);if(k==='same_company_review')e.checked=!!data[k];else e.value=data[k]??''});form.elements.deadline.disabled=form.elements.deadline_state.value!=='Fixed';baseline=JSON.stringify(values());form.oninput=()=>{dirty=JSON.stringify(values())!==baseline};form.onchange=()=>{if(form.elements.deadline_state.value!=='Fixed')form.elements.deadline.value='';form.elements.deadline.disabled=form.elements.deadline_state.value!=='Fixed';dirty=JSON.stringify(values())!==baseline};el('ff-cancel').onclick=()=>abandon();form.onsubmit=save;form.elements.title.focus();form.scrollIntoView({block:'nearest',behavior:'smooth'})}
 function samePayload(row,payload){return fields.every(k=>JSON.stringify(row[k]??null)===JSON.stringify(payload[k]??null))}
 async function save(e){e.preventDefault();if(saving||!form)return;const payload=values(),error=validate(payload);if(error){el('ff-save-status').textContent=error;return}const saveStatus=el('ff-save-status');lock();saveStatus.textContent='Saving…';const attempt={id:draftId,payload:{...payload},revision:editing?.revision??null};try{if(!await owner()){dispose();return}let r;if(editing){r=await api.from('funding_opportunities').update(payload).eq('id',editing.id).eq('revision',editing.revision).select('id,revision').maybeSingle();if(!r.error&&!r.data){saveStatus.textContent='This opportunity changed elsewhere. Your draft is preserved. Copy your edits, then Cancel and Refresh to review the latest version.';return}}else{lastAttempt=attempt;r=await api.from('funding_opportunities').insert({id:draftId,...payload}).select('id,revision').maybeSingle();if(r.error?.code==='23505'){const existing=await api.from('funding_opportunities').select('*').eq('id',draftId).maybeSingle();if(!existing.error&&existing.data&&samePayload(existing.data,payload))r={data:existing.data,error:null};else{saveStatus.textContent='This create may already have saved with different values. Your draft is preserved. Copy your edits, then Cancel and Refresh to review the saved record.';return}}}if(r.error)throw r.error;if(!r.data)throw new Error('The server did not confirm this save.');if(closed)return;closeEditor();status('Opportunity saved.');await refresh()}catch(err){if(!closed)saveStatus.textContent='Save was not confirmed. Your draft and record ID are kept for a safe retry. '+(err.message||'Check the connection.')}finally{unlock()}}
