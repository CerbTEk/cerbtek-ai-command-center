</main></div>", "signup": "<div><main class=\"auth-shell kairo-auth-shell\"><section class=\"auth-card kairo-auth-card\" aria-label=\"Kairo account access\"><div class=\"auth-brand\"><img class=\"brand-banner\" src=\"https://www.cerbtek.com/kairo-banner.png\" alt=\"Kairo by CerbTEK\" width=\"2048\" height=\"683\"></div><div class=\"auth-content\"><h1>Create account</h1><p>Create your Kairo account to get started.</p><form><label>Email<input type=\"email\" required=\"\" value=\"\"></label><div class=\"auth-field\"><div class=\"auth-field-heading\"><label for=\"kairo-auth-password\">Password</label></div><input id=\"kairo-auth-password\" type=\"password\" required=\"\" minlength=\"12\" value=\"\"><small class=\"password-hint\">12+ characters \u2022 upper &amp; lowercase \u2022 number \u2022 symbol</small></div><button class=\"primary\">Create account</button></form><p class=\"auth-account-switch\"><span>Already have an account?</span><button type=\"button\" class=\"link\">Sign in</button></p></div><footer class=\"auth-footer\"><a class=\"auth-investor-link\" href=\"/investors/\">Investors &amp; strategic partners <span aria-hidden=\"true\">\u2197</span></a></footer></section></main></div>", "reset": "<div><main class=\"auth-shell kairo-auth-shell\"><section class=\"auth-card kairo-auth-card\" aria-label=\"Kairo account access\"><div class=\"auth-brand\"><img class=\"brand-banner\" src=\"https://www.cerbtek.com/kairo-banner.png\" alt=\"Kairo by CerbTEK\" width=\"2048\" height=\"683\"></div><div class=\"auth-content\"><p class=\"eyebrow\">ACCOUNT RECOVERY</p><h1>Choose a new password</h1><p>Use a unique password you haven\u2019t used elsewhere.</p><form aria-busy=\"false\"><label>New password<input type=\"password\" autocomplete=\"new-password\" minlength=\"12\" required=\"\" value=\"\"></label><small class=\"password-hint\">12+ characters \u2022 upper &amp; lowercase \u2022 number \u2022 symbol</small><label>Confirm new password<input type=\"password\" autocomplete=\"new-password\" minlength=\"12\" required=\"\" value=\"\"></label><button class=\"primary\">Save new password</button></form><button type=\"button\" class=\"link\">Back to sign in</button></div><footer class=\"auth-footer\"><a class=\"auth-investor-link\" href=\"/investors/\">Investors &amp; strategic partners <span aria-hidden=\"true\">\u2197</span></a></footer></section></main></div>"};

const screen = ['signin','signup','forgot','reset'].includes(query.get('screen')) ? query.get('screen') : 'signin';
function gotoScreen(next) { query.set('screen', next); location.search=query.toString(); }

 });
